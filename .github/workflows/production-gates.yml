name: Production Gates

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  NODE_VERSION: '20'
  DATABASE_URL: ${{ secrets.DATABASE_URL }}

jobs:
  # ── Gate 1: Lint & Code Governance ────────────────────────
  lint-governance:
    name: Code Governance
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - name: ESLint mobile gate rules
        run: npm run lint
      - name: API contract tests
        run: npm run test:contracts
      - name: Dependency vulnerability gate
        run: npm audit --audit-level=critical
      - name: Mobile API blocker audit
        run: node scripts/audit-mobile-blockers.js
      - name: Intelligence governance audit
        run: node scripts/audit-intelligence.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Gate 2: Performance Budget ─────────────────────────────
  performance-budget:
    name: Performance Budget
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - name: Build production bundle
        run: npm run build
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
      - name: Audit performance budgets
        run: node scripts/audit-performance-budget.js

  # ── Gate 3: Database Integrity ─────────────────────────────
  database-integrity:
    name: Database Integrity
    runs-on: ubuntu-latest
    if: github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - name: Database performance audit
        run: node scripts/audit-db-performance.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Academic integrity audit
        run: node scripts/audit-academics.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Backup restore verification
        run: node scripts/verify-backup-restore.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  # ── Gate 4: Release Readiness ──────────────────────────────
  release-readiness:
    name: Release Readiness
    runs-on: ubuntu-latest
    needs: [lint-governance, performance-budget, database-integrity]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '${{ env.NODE_VERSION }}', cache: 'npm' }
      - run: npm ci
      - name: Full release readiness check
        run: node scripts/release-readiness-check.js
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      - name: Block deployment on failure
        if: failure()
        run: |
          echo "::error::PRODUCTION GATE FAILED — deployment blocked"
          echo "::error::Check release-readiness-check.js output above"
          exit 1
