name: Supabase Keep-Alive Engine

on:
  schedule:
    # Ping every 4 hours — keeps Supabase free tier from pausing (7-day inactivity threshold)
    - cron: '0 */4 * * *'
  
  # Keeps the workflow "active" in GitHub's eyes — prevents auto-disable on quiet repos
  push:
    branches: [main]
    paths:
      - '.github/workflows/supabase-keep-alive.yml'
  
  workflow_dispatch: # Manual trigger for immediate testing

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Ping Supabase REST API
        env:
          # SECURITY: Use secrets only — no hardcoded fallbacks in plaintext
          # Set these in: GitHub repo → Settings → Secrets → Actions
          SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_URL" ] || [ -z "$SUPABASE_ANON_KEY" ]; then
            echo "❌ ERROR: Supabase secrets not configured in GitHub Actions."
            echo "Go to: Repo → Settings → Secrets and variables → Actions"
            echo "Add: NEXT_PUBLIC_SUPABASE_URL and NEXT_PUBLIC_SUPABASE_ANON_KEY"
            exit 1
          fi

          # Ping the health endpoint — doesn't require RLS auth, always accessible
          # Uses Supabase's built-in REST meta endpoint which any anon key can reach
          HTTP_CODE=$(curl -s -o /dev/null -w "%{http_code}" \
            --max-time 15 \
            -H "apikey: $SUPABASE_ANON_KEY" \
            -H "Authorization: Bearer $SUPABASE_ANON_KEY" \
            "$SUPABASE_URL/rest/v1/")

          echo "Supabase REST ping response: HTTP $HTTP_CODE"

          # Any HTTP response (200, 401, 403, 404...) proves Supabase is alive.
          # Only HTTP 000 means curl could not connect at all (project is paused/offline).
          if [ "$HTTP_CODE" = "000" ]; then
            echo "❌ Could not connect to Supabase — project may be paused."
            exit 1
          fi

          echo "✅ Supabase is alive and responding (HTTP $HTTP_CODE)"

      - name: Log Keep-Alive Timestamp
        run: echo "✅ Keep-alive ping completed at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
