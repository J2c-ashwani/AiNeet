name: PR Checks

on:
  pull_request:
    branches: [ main ]

jobs:
  validate-and-test:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        
    - name: Install dependencies
      run: npm ci
      
    - name: Run ESLint UI Gates
      run: npm run lint:design
      
    - name: Validate Internal Routes
      run: npm run lint:routes
      
    - name: Assert Primary Routes
      run: npm run lint:primary-routes
      
    - name: Build Next.js App
      run: npm run build
      
    - name: Install Playwright Browsers
      run: npx playwright install --with-deps chromium
      
    - name: Run E2E Journey Tests
      run: npm run test:visual
