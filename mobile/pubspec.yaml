name: neet_coach_mobile
description: "AI NEET Coach — India's #1 AI-powered NEET preparation platform"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter

  # UI & Icons
  cupertino_icons: ^1.0.8
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  fl_chart: ^0.69.0

  # Navigation
  go_router: ^14.6.2

  # State Management
  flutter_riverpod: ^2.6.1

  # Auth & Backend
  supabase_flutter: ^2.8.4
  dio: ^5.7.0

  # Secure Storage
  flutter_secure_storage: ^9.2.2

  # Firebase (already configured)
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.4

  # Native OS Features
  image_picker: ^1.1.2
  file_picker: ^8.1.6
  url_launcher: ^6.3.1
  local_auth: ^2.3.0
  connectivity_plus: ^6.1.1
  share_plus: ^10.1.4
  path_provider: ^2.1.5
  package_info_plus: ^8.3.0

  # Error Reporting
  sentry_flutter: ^8.14.0

  # Security
  crypto: ^3.0.6
  webview_flutter: ^4.13.1
  in_app_review: ^2.0.11

  # Monetization
  google_mobile_ads: ^5.3.0

dev_dependencies:
  sentry_dart_plugin: ^3.2.1
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.13
  riverpod_generator: ^2.6.3
  flutter_launcher_icons: ^0.14.2

flutter_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/animations/
    - assets/images/

sentry:
  upload_debug_symbols: true
  upload_source_maps: true
  project: flutter
  org: ai-neet-coach
